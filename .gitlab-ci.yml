image: "sbtscala/scala-sbt:graalvm-community-25.0.2_1.13.0_3.9.0"

stages:
  - test
  - deploy
  - docker_build
  - docker_push

variables:
  SBT_OPTS: "-Dsbt.global.base=sbt-cache/.sbtboot -Dsbt.boot.directory=sbt-cache/.boot -Dsbt.ivy.home=sbt-cache/.ivy -Dsbt.coursier.home=sbt-cache/.coursier"
  # Instruct Testcontainers to use the daemon of DinD, use port 2375 for non-tls connections.
  DOCKER_HOST: "tcp://docker:2375"
  # Instruct Docker not to start over TLS.
  DOCKER_TLS_CERTDIR: ""
  # Improve performance with overlayfs.
  DOCKER_DRIVER: overlay2
  MUSL_TOOLCHAIN: "musl-toolchain-1.2.5-oracle-00001-linux-amd64"

# Dependency caches only (no compiled classes): shared by all branches, reset when the dependencies change
.sbt_cache: &sbt_cache
  key:
    prefix: sbt
    files:
      - project/Dependencies.scala
      - project/plugins.sbt
  paths:
    - "sbt-cache/.sbtboot"
    - "sbt-cache/.boot"
    - "sbt-cache/.ivy"
    - "sbt-cache/.coursier"

# Jobs that only need to read the sbt cache
.sbt_cache_pull: &sbt_cache_pull
  <<: *sbt_cache
  policy: pull

unit_test:
  stage: test
  services:
    # DinD service is required for Testcontainers
    - name: docker:dind
      # explicitly disable tls to avoid docker startup interruption
      command: ["--tls=false"]
  cache:
    - *sbt_cache
  script:
    - sbt coverage test coverageReport coverageAggregate
  artifacts:
    paths:
      - target/scala-3.9.0/scoverage-report/
      - target/scala-3.9.0/coverage-report/
    when: always
    reports:
      junit:
        - modules/core/target/test-reports/TEST-*.xml
  coverage: '/Statement coverage[A-Za-z\.*]\s*:\s*([^%]+)/'

check_format:
  stage: test
  cache:
    - *sbt_cache_pull
  script:
    - sbt fmtCheck
  allow_failure: true

check_dependency_update:
  stage: test
  cache:
    - *sbt_cache_pull
  script:
    - sbt "set dependencyUpdatesFailBuild := true" dependencyUpdates
  allow_failure: true

# Builds both native images in a single sbt run, so the shared modules are compiled only once.
# Runs in parallel with the tests: coverage-instrumented classes must not end up in the released binaries anyway.
build_native:
  stage: test
  only:
    - master
    - tags
  cache:
    - *sbt_cache_pull
    - key: "$MUSL_TOOLCHAIN"
      paths:
        - "musl"
  before_script:
    # Using recommended musl toolchain in order to allow building a statically linked native image
    - |
      if [ ! -d musl/musl-toolchain ]; then
        mkdir -p musl
        curl -fSL "https://gds.oracle.com/download/bfs/archive/$MUSL_TOOLCHAIN.tar.gz" | tar -C musl -xz
      fi
    - export PATH="$CI_PROJECT_DIR/musl/musl-toolchain/bin:$PATH"
  script:
    - sbt cli/nativeImage server/nativeImage
  artifacts:
    paths:
      - modules/cli/target/native-image/cli
      - modules/server/target/native-image/server
    expire_in: 1 day

pages:
  stage: deploy
  cache: []
  dependencies:
    - unit_test
  script:
    - rm -rf public/coverage
    - mkdir -p public/coverage
    - mv target/scala-3.9.0/scoverage-report/* public/coverage/
  artifacts:
    paths:
      - public
    expire_in: 30 days
  only:
    - master

# Only packages the binary produced by `build_native`, no compilation happens here
Build image:
  image: docker:latest
  services:
    - docker:dind
  stage: docker_build
  cache: []
  needs:
    - build_native
  parallel:
    matrix:
      - MODULE: [cli, server]
  only:
    - master
    - tags
  variables:
    DOCKER_BUILDKIT: "1"
  script:
    - echo -n $CI_JOB_TOKEN | docker login -u gitlab-ci-token --password-stdin $CI_REGISTRY
    - >
      docker build
      --pull
      --target prebuilt
      --build-arg VCS_REF=$CI_COMMIT_SHA
      --build-arg VCS_URL=$CI_PROJECT_URL
      --build-arg MODULE=$MODULE
      --tag $CI_REGISTRY_IMAGE/$MODULE:$CI_COMMIT_SHA
      .
    - docker push $CI_REGISTRY_IMAGE/$MODULE:$CI_COMMIT_SHA

Push latest:
  image: docker:latest
  services:
    - docker:dind
  variables:
    GIT_STRATEGY: none
  stage: docker_push
  cache: []
  dependencies: []
  only:
    - master
  script:
    - echo -n $CI_JOB_TOKEN | docker login -u gitlab-ci-token --password-stdin $CI_REGISTRY
    - docker pull $CI_REGISTRY_IMAGE/cli:$CI_COMMIT_SHA
    - docker pull $CI_REGISTRY_IMAGE/server:$CI_COMMIT_SHA
    - docker tag $CI_REGISTRY_IMAGE/cli:$CI_COMMIT_SHA $CI_REGISTRY_IMAGE/cli:latest
    - docker tag $CI_REGISTRY_IMAGE/server:$CI_COMMIT_SHA $CI_REGISTRY_IMAGE/server:latest
    - docker push $CI_REGISTRY_IMAGE/cli:latest
    - docker push $CI_REGISTRY_IMAGE/server:latest
    - echo -n $DOCKER_HUB_PASSWORD | docker login -u tyoras --password-stdin
    - docker tag $CI_REGISTRY_IMAGE/cli:$CI_COMMIT_SHA tyoras/cards:latest
    - docker push tyoras/cards:latest
    - docker tag $CI_REGISTRY_IMAGE/server:$CI_COMMIT_SHA tyoras/cards-server:latest
    - docker push tyoras/cards-server:latest

Push tag:
  image: docker:latest
  services:
    - docker:dind
  variables:
    GIT_STRATEGY: none
  stage: docker_push
  cache: []
  dependencies: []
  only:
    - tags
  script:
    - echo -n $CI_JOB_TOKEN | docker login -u gitlab-ci-token --password-stdin $CI_REGISTRY
    - docker pull $CI_REGISTRY_IMAGE/cli:$CI_COMMIT_SHA
    - docker pull $CI_REGISTRY_IMAGE/server:$CI_COMMIT_SHA
    - docker tag $CI_REGISTRY_IMAGE/cli:$CI_COMMIT_SHA $CI_REGISTRY_IMAGE/cli:$CI_COMMIT_REF_NAME
    - docker tag $CI_REGISTRY_IMAGE/server:$CI_COMMIT_SHA $CI_REGISTRY_IMAGE/server:$CI_COMMIT_REF_NAME
    - docker push $CI_REGISTRY_IMAGE/cli:$CI_COMMIT_REF_NAME
    - docker push $CI_REGISTRY_IMAGE/server:$CI_COMMIT_REF_NAME
    - echo -n $DOCKER_HUB_PASSWORD | docker login -u tyoras --password-stdin
    - docker tag $CI_REGISTRY_IMAGE/cli:$CI_COMMIT_SHA tyoras/cards:$CI_COMMIT_REF_NAME
    - docker tag $CI_REGISTRY_IMAGE/server:$CI_COMMIT_SHA tyoras/cards-server:$CI_COMMIT_REF_NAME
    - docker push tyoras/cards:$CI_COMMIT_REF_NAME
    - docker push tyoras/cards-server:$CI_COMMIT_REF_NAME
