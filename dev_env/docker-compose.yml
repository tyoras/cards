name: cards_dev_env
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: cards
      POSTGRES_PASSWORD: password
      POSTGRES_DB: cards
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - 5432:5432
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U cards -d cards" ]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
